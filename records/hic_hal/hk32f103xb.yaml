common:
    target:
        - Cortex-M3
    core:
        - Cortex-M3
    macros:
        - INTERFACE_HK32F103XB
        - HK32F103CBT6
        - DAPLINK_HIC_ID=0x97969950
        - __packed=__packed
        - DAPLINK_NO_ASSERT_FILENAMES
        - OS_CLOCK=72000000
        # - OS_CLOCK=48000000
    includes:
        - source/hic_hal/hk32/hk32f103xb
        - source/hic_hal/hk32/hk32f103xb/cmsis
        - source/hic_hal/hk32/hk32f103xb/StdPeriphDriver/inc
        - source/hic_hal/hk32/hk32f103xb/hal
    sources:
        hic_hal:
            - source/hic_hal/hk32/hk32f103xb
            - source/hic_hal/hk32/hk32f103xb/cmsis
            - source/hic_hal/hk32/hk32f103xb/StdPeriphDriver/src

tool_specific:
    gcc_arm:
        sources:
            hic_hal:
                - source/hic_hal/hk32/hk32f103xb/gcc
